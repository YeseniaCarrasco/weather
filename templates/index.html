{% extends "base.html" %}

{% block title %}San Jose Weather{% endblock %}

{% block content %}
  <h1>San Jose, California</h1>
  {% if weather %}
    <p class="temp">{{ weather.temperature }}&deg;F</p>
    <p class="desc">{{ weather.description }}</p>
  {% else %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <nav><a href="{{ url_for('zip_weather') }}">Look up another zip code</a></nav>
{% endblock %}
